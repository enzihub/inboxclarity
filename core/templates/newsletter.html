<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            background: linear-gradient(145deg, #232323, #121212);
            border-radius: 8px;
            width: 80%;
            max-width: 600px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 0 auto;
        }

        .title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            object-fit: cover;
        }

        .opacity-bar {
            width: 80%;
            height: 1px;
            background-color: #ffffff;
            opacity: 0.2;
            margin: 10px 0;
        }

        .date {
            font-size: 14px;
            font-weight: 400;
            color: #999999;
            margin-bottom: 20px;
            width: 100%;
        }

        .text {
            font-size: 14px;
            font-weight: 400;
            line-height: 1.62;
            color: #bcbcbc;
            margin-bottom: 20px;
            width: 100%;
        }

        .text-content {
            color: rgba(188, 188, 188, 0.85);
        }

        .bold {
            font-weight: 800;
            display: block;
            margin-bottom: 0;
        }

        .action-item {
            font-size: 14px;
            font-weight: 400;
            margin: 5px 0;
            color: rgba(200, 200, 200, 0.85);
        }

        .action-item span {
            font-weight: 500;
        }

        .highlight {
            color: #e6b800;
        }

        .unsubscribe {
            font-size: 12px;
            color: #666666;
            margin-top: 20px;
            text-align: center;
        }

        .unsubscribe a {
            color: #999999;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            {% if logo_data %}
            <img src="{{ logo_data }}" alt="Logo" class="logo">
            {% endif %}
            Morning Brief
        </div>
        <div class="opacity-bar"></div>
        <div class="date">Date: {{ timestamp }}<br>Prepared For: {{ prep_for }}<br>Prepared By: {{ prep_by }}</div>

        <div class="text">
            <div class="text-content">{{ summary | safe }}</div>
        </div>

        {% if settings_url %}
        <div class="unsubscribe">
            <p>Want to unsubscribe? <a href="{{ settings_url }}">Manage your preferences here</a></p>
        </div>
        {% endif %}
    </div>
</body>
</html>
